<!doctype html>
<html lang="ko" data-type="service" data-radius="soft" data-buttons="arrow" data-motion>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="site-kind" content="other" />
    <meta name="page-type" content="service" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400..500&display=swap" rel="stylesheet" />
    <title>장인기: 업무 시스템부터 서비스까지 만드는 개발자</title>
    <meta name="description" content="인사·급여 ERP 실무 약 3년, 직접 기획한 서비스 두 개를 배포한 소프트웨어 개발자 장인기의 포트폴리오." />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="장인기: 업무 시스템부터 서비스까지 만드는 개발자" />
    <meta property="og:description" content="ERP 실무 3년과 직접 만든 서비스, 장인기의 포트폴리오" />
    <meta property="og:url" content="https://iokl1004.github.io/janginki-portfolio/" />
    <meta property="og:image" content="https://iokl1004.github.io/janginki-portfolio/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="pofol-verify" content="pofol-verify-a37f8a3f85898a57">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <!-- taste kit: hero entrance and the dealt moment wait for their scripts -->
    <script>document.documentElement.classList.add('m-enter');setTimeout(()=>document.documentElement.classList.add('m-enter-done'),700)</script>
    <script>document.documentElement.classList.add('mo-js');setTimeout(()=>document.documentElement.classList.add('mo-safe'),2500)</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- kit scripts run after React has rendered (main.tsx renders synchronously) -->
    <script type="module">
      for (const p of ['kit/system.js', 'kit/motion/motion.js', 'kit/layout/layout.js'])
        await import(/* @vite-ignore */ new URL(p, document.baseURI).href)
    </script>
  </body>
</html>
